name: staysuite_app
description: "StaySuite AI — Multi-Platform Hospitality & Resort Business OS (Web, Mobile, Desktop)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1

  # Local Offline Database
  drift: ^2.16.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.3.3

  # Networking & Real-Time Sync
  dio: ^5.4.1
  connectivity_plus: ^5.0.2
  web_socket_channel: ^2.4.5
  intl: ^0.19.0

  # Hardware: Thermal Printing (Mobile Bluetooth & Desktop USB)
  esc_pos_utils_plus: ^2.0.3
  print_bluetooth_thermal: ^1.1.1
  flutter_pos_printer_platform_image_3: ^3.1.2

  # On-Device Privacy ID OCR (Aadhaar redaction)
  google_mlkit_text_recognition: ^0.11.0

  # UI & Media
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
