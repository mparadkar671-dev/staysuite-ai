# StaySuite AI - local development stack
#   docker compose up --build
# API:      http://localhost:8000/docs
# Postgres: localhost:${POSTGRES_PORT:-5432}   Redis: localhost:${REDIS_PORT:-6379}
name: staysuite

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staysuite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staysuite}
      POSTGRES_DB: ${POSTGRES_DB:-staysuite}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-staysuite}:${POSTGRES_PASSWORD:-staysuite}@postgres:5432/${POSTGRES_DB:-staysuite}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/code/app
      - ./backend/alembic:/code/alembic
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  booking_marketplace_web:
    build:
      context: ./booking_marketplace_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      - backend

  superadmin_web:
    build:
      context: ./superadmin_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - backend

  staysuite_web:
    build:
      context: ./staysuite_app
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      - backend

  db_viewer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres


volumes:
  pgdata:
  redisdata:
